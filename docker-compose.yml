services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: memory_assistant
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
    ports:
      - "5432:5432"
    volumes:
      - memory_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memory_postgres:
